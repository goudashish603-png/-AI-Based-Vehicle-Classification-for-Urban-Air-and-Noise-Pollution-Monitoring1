model:
  architecture: "resnet50"
  pretrained: true
  freeze_backbone: false
  learning_rate: 0.0003
  weight_decay: 0.0001
  batch_size: 32
  num_epochs: 10
  num_classes: 6
  classes:
    0: "Petrol"
    1: "Diesel"
    2: "Electric Vehicle (EV)"
    3: "CNG/LPG"
    4: "Hybrid"
    5: "Unknown"

data:
  input_size: [224, 224]
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
